name: Crear APK de Jessi

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Comprobar Java y Android SDK
        run: |
          java -version
          javac -version
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          which adb || true
          which sdkmanager || true
          sdkmanager --version

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar juego
        run: npx cap sync android

      - name: Forzar pantalla horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("No se encontró AndroidManifest.xml")

          s = p.read_text(encoding="utf-8")

          pattern = r'(<activity\b[^>]*android:name="\.MainActivity"[^>]*)(>)'

          def add_orientation(match):
              activity = match.group(1)

              if "android:screenOrientation" not in activity:
                  activity += ' android:screenOrientation="landscape"'

              return activity + match.group(2)

          new_s = re.sub(
              pattern,
              add_orientation,
              s,
              count=1
          )

          p.write_text(new_s, encoding="utf-8")

          print("Pantalla horizontal configurada correctamente.")
          PY

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Comprobar APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jessi-Reino-del-Diamante-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
