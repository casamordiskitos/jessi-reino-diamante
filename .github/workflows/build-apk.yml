name: Crear APK de Jessi

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Capacitor
        run: npm install

      - name: Crear aplicación Android
        run: npx cap add android

      - name: Sincronizar juego
        run: npx cap sync android

      - name: Poner pantalla horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'(<activity\b[^>]*android:name="\.MainActivity"[^>]*)(>)',
              lambda m: (
                  m.group(1)
                  if "android:screenOrientation" in m.group(1)
                  else m.group(1) + ' android:screenOrientation="landscape"'
              ) + m.group(2),
              s,
              count=1
          )

          p.write_text(s)
          PY

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jessi-Reino-del-Diamante-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
